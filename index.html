<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Supriya</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:            #fffaf9;
  --bg-deep:       #ffeef2;
  --ink:           #3a2530;
  --ink-soft:      #6b4a58;
  --ink-faint:     #a98a95;
  --rose:          #c96f8b;
  --blush:         #ffd7e0;
  --sage:          #6f8f6a;
  --sage-soft:     #e5efe2;
  --line:          rgba(58,37,48,0.12);
  --serif: 'Fraunces', Georgia, serif;
  --sans:  'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

*{ margin:0; padding:0; box-sizing:border-box; }

body {
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* Stops scrolling while intro plays */
body.locked { overflow: hidden; }

h1,h2,h3,.serif{ font-family:var(--serif); font-weight:500; color:var(--ink); }
::selection{ background:var(--blush); color:var(--ink); }

/* ============================================================
   CINEMATIC INTRO (FOOLPROOF PACING)
   ============================================================ */
#intro-lock {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: 24px; text-align: center;
  transition: opacity 1s ease, transform 1s ease;
}
#intro-text {
  font-family: var(--serif);
  font-size: clamp(1.8rem, 6vw, 3rem);
  color: var(--ink);
  opacity: 0;
  transition: opacity 0.8s ease;
}

/* ============================================================
   LAYOUT PRIMITIVES
   ============================================================ */
section{ position:relative; width:100%; min-height: 90vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 60px 24px; text-align: center; }
.wrap{ max-width:640px; margin:0 auto; width:100%; }
.eyebrow{ font-size:0.75rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--rose); font-weight:600; margin-bottom:14px; display:block; }

/* ============================================================
   HERO
   ============================================================ */
#hero-title{ font-size:clamp(2.5rem, 9vw, 5rem); line-height:1.1; margin-bottom: 20px;}
#hero-sub{ font-size:1.1rem; color:var(--ink-soft); }

/* ============================================================
   VIDEO SECTION
   ============================================================ */
#memories { background: var(--bg-deep); padding: 0; min-height: 100vh; }
.video-wrapper {
  position: relative;
  width: 100%;
  height: 100vh;
  background: #000;
}
.video-wrapper video {
  width: 100%; height: 100%; object-fit: contain;
}
#video-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #fff; font-family: var(--sans); cursor: pointer; z-index: 10;
  transition: opacity 0.3s;
}
#video-overlay .icon { font-size: 3rem; margin-bottom: 10px; }
#video-overlay h3 { color: #fff; font-family: var(--sans); font-size: 1.5rem; letter-spacing: 1px; }

/* ============================================================
   BUILD-UP
   ============================================================ */
#buildup p{ font-family:var(--serif); font-size:clamp(1.6rem,5vw,2.8rem); line-height:1.5; color:var(--ink-soft); }

/* ============================================================
   CELEBRATION (FLOWER & TEXT)
   ============================================================ */
#celebration { background: var(--bg-deep); }
#flower-btn {
  font-size: 6rem; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  animation: bob 3s ease-in-out infinite; transition: transform 0.3s;
}
#flower-btn:active { transform: scale(0.9); }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }

#birthday-reveal-text {
  font-family: var(--serif);
  font-size: clamp(2rem, 8vw, 4rem);
  color: var(--rose);
  opacity: 0;
  display: none;
  margin-top: 20px;
}

/* ============================================================
   CAROUSEL (FIXED HORIZONTAL SCROLL)
   ============================================================ */
.carousel {
  width: 100%; max-width: 400px; margin: 0 auto 30px;
  display: flex; overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  border-radius: 8px; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
  scrollbar-width: none; /* Firefox */
}
.carousel::-webkit-scrollbar { display: none; } /* Chrome/Safari */

.carousel .slide {
  flex: 0 0 100%;
  scroll-snap-align: center;
  aspect-ratio: 3/4;
}
.carousel .slide img { width: 100%; height: 100%; object-fit: cover; }

/* ============================================================
   GATE & LETTER
   ============================================================ */
.gate{ max-width:420px; margin:0 auto; padding:40px 24px; border:1px solid var(--line); border-radius:8px; }
.gate input{ width:100%; padding:14px; font-size:1rem; border:1px solid var(--line); border-radius:4px; text-align:center; margin: 15px 0; outline:none; }
.gate input:focus{ border-color:var(--rose); }
.gate button{ padding:12px 30px; border-radius:30px; border:none; background:var(--ink); color:#fff; font-size: 1rem; cursor:pointer; }
.gate .msg { color: var(--rose); font-size: 0.9rem; min-height: 20px; margin-bottom: 10px;}

.letter{ display:none; max-width:560px; margin:40px auto; text-align:left; line-height:1.8; font-size:1.05rem; white-space:pre-line; padding: 20px;}
.coffee{ display:none; max-width:420px; margin:40px auto; padding:30px; background:var(--sage-soft); border-radius:8px; }
.coffee button{ width: 100%; padding:12px; margin-top: 10px; border-radius:30px; border:none; font-weight:600; cursor:pointer; font-size:1rem; }
.coffee .yes{ background:var(--sage); color:#fff; }
.coffee .no{ background:transparent; color:#4a7c44; border:1px solid #b9d1b3; }

#audio-btn{ position:fixed; bottom:20px; right:20px; z-index:80; width:45px; height:45px; border-radius:50%; background:#241318; border:2px solid rgba(255,255,255,0.3); display:flex; align-items:center; justify-content:center; }
#audio-btn::after{ content:'🎵'; font-size: 18px; }

canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
</style>
</head>
<body class="locked">

<script>
/* ============================================================
   YOUR CONFIGURATION
   ============================================================ */
const CONFIG = {
  herName: "Supriya",
  yourName: "Sanket",

  // 1. The Intro Text that plays automatically on load
  whisper: [
    "Hey...",
    "Can I borrow two minutes of your day?",
    "I've been waiting for today.",
    "I made something just for you.",
    "So —",
    "let's begin."
  ],

  // 2. The Fullscreen Video 
  videoSrc: "editedvideofinal.mp4",

  buildupLine: "Two months in, and I already know your \u201chaa\u201d is a whole language of its own.",

  // 3. The Finale Gallery
  finalCarousel: ["image1.jpeg", "image2.jpg"],

  password: { answer: "supriya", hint: "Hint: the prettiest girl I know." },

  letter: `Happy Birthday!! 🥳🎂

Finally tumhara birthday aa hi gaya.

Baaki, aaj ke din bas khush rehna.
Aur cake share karna... (Just kidding. Mat karna. karogi bhi kaise!!)

once again — Happiesttt Birthday! 🌻`,

  coffee: {
    question: "Coffee or tea sometime? ☕",
    sub: "No pressure at all, just thought it'd be fun to chat! 🪴",
    yes: "Sounds fun! ✨",
    no: "Hatt be 🤣"
  },

  music: { enabled: true, playlist: ["track1.mp3"] },
  discordWebhook: "https://discord.com/api/webhooks/1534157023623516224/07_3EG93GPJcqHqpKQZwzjOdqzXMTtRsJIytQvjc3ymwmfvoCtoZ47xIpQYBIVzZhuKI"
};
</script>

<!-- AUTO-PLAYING INTRO -->
<div id="intro-lock"><div id="intro-text"></div></div>

<canvas id="confetti"></canvas>
<div id="audio-btn"></div>

<!-- HERO -->
<section id="hero">
  <h1 id="hero-title">Happy Birthday,<br>Supriya</h1>
  <p id="hero-sub">Keep scrolling downwards ↓</p>
</section>

<!-- FULLSCREEN VIDEO -->
<section id="memories">
  <div class="video-wrapper">
    <video id="main-video" playsinline loop></video>
    <div id="video-overlay">
      <div class="icon">🔊</div>
      <h3>TAP FOR SOUND<br>& FULLSCREEN</h3>
    </div>
  </div>
</section>

<!-- BUILD-UP -->
<section id="buildup">
  <div class="wrap"><p id="buildup-text"></p></div>
</section>

<!-- CELEBRATION -->
<section id="celebration">
  <div id="flower-btn">🌸</div>
  <p style="color:var(--rose); margin-top:10px; font-size:0.8rem; letter-spacing:2px; text-transform:uppercase;" id="flower-hint">Tap to make a wish</p>
  
  <!-- This is the text that reveals AFTER tapping the flower -->
  <h1 id="birthday-reveal-text">Happy Birthday,<br>Supriya! 🥳</h1>
</section>

<!-- FINALE / CAROUSEL -->
<section id="finale">
  <div class="wrap">
    <h2 style="margin-bottom: 30px;">For you.</h2>
    
    <!-- Fixed Horizontal Carousel -->
    <div class="carousel" id="carousel"></div>
    <p style="color:var(--ink-soft); font-size:0.9rem; margin-bottom: 40px;">← Swipe to view →</p>

    <!-- Password Gate -->
    <div class="gate" id="gate">
      <h3>Secret Password 🔐</h3>
      <p id="gate-hint"></p>
      <input type="text" id="gate-input" placeholder="Type name here..." autocomplete="off">
      <div class="msg" id="gate-msg"></div>
      <button id="gate-btn">Unlock 🔓</button>
    </div>

    <div class="letter" id="letter"></div>

    <div class="coffee" id="coffee">
      <h3 id="coffee-q"></h3>
      <p id="coffee-sub"></p>
      <button class="yes" id="btn-yes"></button>
      <button class="no" id="btn-no"></button>
      <p id="coffee-thanks" style="display:none; color:#33512f; font-weight:bold; margin-top:15px;">Got it, thanks! 🌻</p>
    </div>
  </div>
</section>

<script>
/* ---------------- 1. THE INTRO SEQUENCE ---------------- */
// This guarantees she reads the whisper text before she can scroll.
window.onload = () => {
  const textEl = document.getElementById('intro-text');
  const lockScreen = document.getElementById('intro-lock');
  const lines = CONFIG.whisper;
  let index = 0;

  function showNextLine() {
    if (index < lines.length) {
      textEl.textContent = lines[index];
      textEl.style.opacity = 1;
      
      setTimeout(() => {
        textEl.style.opacity = 0;
        index++;
        setTimeout(showNextLine, 800); // Time between sentences
      }, 2000); // Time sentence stays on screen
    } else {
      // Unlock the page
      lockScreen.style.opacity = 0;
      setTimeout(() => {
        lockScreen.style.display = 'none';
        document.body.classList.remove('locked');
      }, 1000);
    }
  }
  
  // Start sequence 1 second after page loads
  setTimeout(showNextLine, 1000);
};

/* ---------------- 2. FULLSCREEN VIDEO FIX ---------------- */
const video = document.getElementById('main-video');
const overlay = document.getElementById('video-overlay');
video.src = CONFIG.videoSrc;

overlay.addEventListener('click', () => {
  // Unmute and play
  video.muted = false;
  video.currentTime = 0;
  video.play();
  
  // Hide overlay
  overlay.style.opacity = '0';
  setTimeout(() => overlay.style.display = 'none', 300);
  
  // Pause background music if playing
  if(musicPlaying) { bgMusic.pause(); musicPlaying = false; }

  // Force Native Fullscreen (Works on iOS and Android)
  if (video.requestFullscreen) {
    video.requestFullscreen();
  } else if (video.webkitEnterFullscreen) {
    video.webkitEnterFullscreen();
  }
});

/* ---------------- 3. FLOWER & BIRTHDAY REVEAL ---------------- */
document.getElementById('flower-btn').addEventListener('click', function() {
  this.style.display = 'none';
  document.getElementById('flower-hint').style.display = 'none';
  
  const revealText = document.getElementById('birthday-reveal-text');
  revealText.style.display = 'block';
  setTimeout(() => revealText.style.opacity = '1', 50);
  
  spawnConfetti(150);
});

/* ---------------- 4. CAROUSEL FIX ---------------- */
const car = document.getElementById('carousel');
CONFIG.finalCarousel.forEach(src => {
  const slide = document.createElement('div');
  slide.className = 'slide';
  slide.innerHTML = `<img src="${src}" alt="Memory">`;
  car.appendChild(slide);
});

/* ---------------- TEXT POPULATION ---------------- */
document.getElementById('buildup-text').textContent = CONFIG.buildupLine;
document.getElementById('gate-hint').textContent = CONFIG.password.hint;

/* ---------------- PASSWORD & LETTER ---------------- */
document.getElementById('gate-btn').addEventListener('click', checkPassword);

function checkPassword() {
  const input = document.getElementById('gate-input').value.trim().toLowerCase();
  const msg = document.getElementById('gate-msg');
  
  if (input === CONFIG.password.answer) {
    document.getElementById('gate').style.display = 'none';
    
    // Show Letter
    const letter = document.getElementById('letter');
    letter.textContent = CONFIG.letter;
    letter.style.display = 'block';
    
    // Show Coffee
    setTimeout(() => {
      document.getElementById('coffee').style.display = 'block';
      document.getElementById('coffee-q').textContent = CONFIG.coffee.question;
      document.getElementById('coffee-sub').textContent = CONFIG.coffee.sub;
      document.getElementById('btn-yes').textContent = CONFIG.coffee.yes;
      document.getElementById('btn-no').textContent = CONFIG.coffee.no;
    }, 1000);
    
    spawnConfetti(50);
  } else {
    msg.textContent = 'Nope! Try again 😉';
  }
}

/* ---------------- DISCORD WEBHOOK ---------------- */
document.getElementById('btn-yes').onclick = () => sendResponse(CONFIG.coffee.yes);
document.getElementById('btn-no').onclick = () => sendResponse(CONFIG.coffee.no);

function sendResponse(answer) {
  document.getElementById('btn-yes').style.display = 'none';
  document.getElementById('btn-no').style.display = 'none';
  document.getElementById('coffee-thanks').style.display = 'block';
  
  if(CONFIG.discordWebhook) {
    fetch(CONFIG.discordWebhook, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({content: `🚨 **Update!** ${CONFIG.herName} clicked: **"${answer}"**`})
    }).catch(()=>{});
  }
}

/* ---------------- BACKGROUND MUSIC ---------------- */
const bgMusic = new Audio();
let musicPlaying = false;
if(CONFIG.music.playlist.length) bgMusic.src = CONFIG.music.playlist[0];

document.getElementById('audio-btn').addEventListener('click', () => {
  if(musicPlaying) { bgMusic.pause(); }
  else { bgMusic.play(); }
  musicPlaying = !musicPlaying;
});

/* ---------------- CONFETTI LOGIC ---------------- */
const canvas=document.getElementById('confetti'), ctx=canvas.getContext('2d');
function fitCanvas(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
fitCanvas(); window.addEventListener('resize',fitCanvas);
let pieces=[], running=false;

function spawnConfetti(count){
  for(let i=0;i<count;i++){
    pieces.push({
      x: Math.random()*canvas.width, y: -20 - Math.random()*200,
      r: Math.random()*4+4, color: ['#ffb7c5','#ffffff','#ffdae0','#c96f8b'][Math.floor(Math.random()*4)],
      vx: (Math.random()-0.5)*2, rot: Math.random()*360, life: 300+Math.random()*200
    });
  }
  if(!running){ running=true; tick(); }
}

function tick(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=pieces.length-1;i>=0;i--){
    const p=pieces[i];
    ctx.fillStyle=p.color; ctx.globalAlpha=0.9;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    p.y += 2; p.x += Math.sin(p.rot*Math.PI/180)*1; p.rot += 2; p.life--;
    if(p.y>canvas.height || p.life<=0) pieces.splice(i,1);
  }
  ctx.globalAlpha=1;
  pieces.length>0 ? requestAnimationFrame(tick) : (running=false);
}
</script>
</body>
