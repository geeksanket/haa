<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:            #fffaf9;
  --bg-deep:       #ffeef2;
  --ink:           #3a2530;
  --ink-soft:      #6b4a58;
  --ink-faint:     #a98a95;
  --rose:          #c96f8b;
  --rose-bright:   #ff8da1;
  --blush:         #ffd7e0;
  --sage:          #6f8f6a;
  --sage-soft:     #e5efe2;
  --line:          rgba(58,37,48,0.12);
  --serif: 'Fraunces', Georgia, serif;
  --sans:  'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

*{ margin:0; padding:0; box-sizing:border-box; }

html{ background:var(--bg); scroll-behavior:auto; }

body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
  overscroll-behavior-y: none; /* Kills the mobile bounce */
  touch-action: pan-y; /* Streamlines touch panning */
}

h1,h2,h3,.serif{ font-family:var(--serif); font-weight:500; letter-spacing:-0.01em; color:var(--ink); }

::selection{ background:var(--blush); color:var(--ink); }

/* Optimized grain */
.grain{
  position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0.015; mix-blend-mode:multiply;
  transform: translateZ(0); /* Hardware acceleration */
  will-change: transform;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ============================================================
   PROGRESS THREAD
   ============================================================ */
#thread{
  position:fixed; left:18px; top:0; bottom:0; width:2px; z-index:60;
  display:flex; justify-content:center;
}
#thread .track{ position:absolute; top:0; bottom:0; width:1px; background:var(--line); }
#thread .fill{ position:absolute; top:0; left:0; width:1px; height:0%; background:linear-gradient(var(--rose-bright), var(--rose)); }
#thread .bud{ position:absolute; left:50%; top:0%; transform:translate(-50%,-50%); font-size:14px; transition:font-size .3s; }
@media (max-width: 640px){ #thread{ left:10px; } }

/* ============================================================
   LAYOUT PRIMITIVES
   ============================================================ */
section{ position:relative; width:100%; }
.wrap{ max-width:640px; margin:0 auto; padding:0 28px; }
.eyebrow{
  font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--rose); font-weight:600; margin-bottom:14px; display:block;
}

/* ============================================================
   HERO
   ============================================================ */
#hero{
  height:100svh; display:flex; flex-direction:column; justify-content:center; align-items:center;
  text-align:center; padding:0 24px; position:relative;
}
#hero .petal-field{ position:absolute; inset:0; overflow:hidden; z-index:0; }
#hero-title{
  font-size:clamp(2.6rem, 9vw, 5.4rem); line-height:0.98; position:relative; z-index:2;
}
#hero-title .line{ display:block; overflow:hidden; }
#hero-title .line span{ display:inline-block; will-change:transform; }
#hero-sub{
  margin-top:22px; font-size:clamp(0.95rem,2.4vw,1.15rem); color:var(--ink-soft); font-weight:400;
  letter-spacing:0.01em; position:relative; z-index:2; opacity:0;
}
#scroll-cue{
  position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:8px; opacity:0;
  color:var(--ink-faint); font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase;
}
#scroll-cue .stem{ width:1px; height:34px; background:linear-gradient(var(--ink-faint), transparent); animation:stemPulse 2.2s ease-in-out infinite; }
@keyframes stemPulse{ 0%,100%{opacity:.3} 50%{opacity:1} }

/* ============================================================
   WHISPER
   ============================================================ */
#whisper{ height:420vh; }
#whisper .stage{
  position:sticky; top:0; height:100svh; display:flex; align-items:center; justify-content:center;
  text-align:center; padding:0 24px; overflow:hidden;
}
#whisper .line{
  position:absolute; font-family:var(--serif); font-weight:400;
  font-size:clamp(1.6rem,5.6vw,3rem); color:var(--ink); max-width:760px; opacity:0;
}

/* ============================================================
   MEMORIES
   ============================================================ */
#memories{ height:260vh; background:var(--bg-deep); }
#memories .stage{
  position:sticky; top:0; height:100vh; overflow:hidden;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
}
#memories .heading{
  position:absolute; top:9%; left:0; right:0; text-align:center; z-index:3; pointer-events:none;
}
#memories .heading .eyebrow{ display:block; }
#memories .heading h2{ font-size:clamp(1.6rem,5vw,2.6rem); }
#memories .frame{
  width:min(86vw,460px); aspect-ratio:9/16; max-height:72vh; border-radius:8px; overflow:hidden;
  position:relative; box-shadow:0 30px 60px -20px rgba(58,37,48,0.28);
  display:flex; align-items:center; justify-content:center; background:#111;
}
#memories .frame video, #memories .frame img{
  width:100%; height:100%; object-fit:contain; display:block; margin:auto; background:#111;
}
#memories .frame .cap{
  position:absolute; left:0; right:0; bottom:0; padding:16px 20px;
  background:linear-gradient(transparent, rgba(0,0,0,0.6));
  color:#fff; font-size:0.9rem; letter-spacing:0.02em; text-align:center;
}
#memories .frame.placeholder{
  background:var(--blush); color:var(--rose); font-family:var(--serif); font-size:2rem;
}

/* ============================================================
   BUILD-UP
   ============================================================ */
#buildup{ padding:26vh 0; background:var(--bg); }
#buildup .wrap{ max-width:720px; }
#buildup p{
  font-family:var(--serif); font-weight:400; font-size:clamp(1.5rem,4.2vw,2.5rem);
  line-height:1.4; color:var(--ink-soft);
}
#buildup .mask{ overflow:hidden; display:inline; }
#buildup .mask span{ display:inline-block; opacity:0.08; }

/* ============================================================
   CELEBRATION
   ============================================================ */
#celebration{
  height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; position:relative; background:var(--bg-deep);
}
#flower-btn{
  font-size:clamp(4rem,18vw,7rem); cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
  filter:drop-shadow(0 10px 24px rgba(255,141,161,0.35)); transition:transform .25s ease;
  animation:bob 3s ease-in-out infinite;
}
#flower-btn:hover{ transform:scale(1.06); }
@keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
#celebration .hint{ margin-top:26px; font-size:0.78rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--rose); opacity:0; transition:opacity .6s; }
#celebration .hint.show{ opacity:0.75; animation:hintPulse 2s infinite; }
@keyframes hintPulse{ 0%,100%{opacity:.4} 50%{opacity:.85} }
#celebration.opened #flower-btn{ pointer-events:none; }

#flash{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:998; transition:opacity .55s ease; }
#suspense{
  position:fixed; inset:0; z-index:900; display:flex; align-items:center; justify-content:center;
  background:var(--bg-deep); opacity:0; pointer-events:none; transition:opacity .5s ease;
}
#suspense p{ font-family:var(--serif); font-size:clamp(1.8rem,7vw,3rem); animation:heartbeat 1.4s infinite ease-in-out; color:var(--rose); }
@keyframes heartbeat{ 0%,100%{transform:scale(1);opacity:.7} 50%{transform:scale(1.04);opacity:1} }

/* ============================================================
   FINALE
   ============================================================ */
#finale{ background:var(--bg); padding:16vh 0 10vh; }
#finale .wrap{ max-width:720px; }
#finale h2{ font-size:clamp(2rem,6vw,3.2rem); margin-bottom:12px; }
#finale .sub{ color:var(--ink-soft); margin-bottom:60px; }

.carousel{
  width:100%; max-width:360px; margin:0 auto 50px; aspect-ratio:3/4; border-radius:4px; overflow:hidden;
  display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
  box-shadow:0 24px 50px -18px rgba(58,37,48,0.28); scrollbar-width:none;
}
.carousel::-webkit-scrollbar{ display:none; }
.carousel .slide{ flex:0 0 100%; scroll-snap-align:center; }
.carousel .slide img, .carousel .slide .placeholder{ width:100%; height:100%; object-fit:cover; display:block; }
.carousel .slide .placeholder{ display:flex; align-items:center; justify-content:center; background:var(--blush); color:var(--rose); font-family:var(--serif); font-size:2.4rem; }
#carousel-dots{ display:flex; gap:7px; justify-content:center; margin:-38px 0 40px; position:relative; z-index:2; }
.dot{ width:6px; height:6px; border-radius:50%; background:rgba(58,37,48,0.25); transition:all .25s; }
.dot.active{ width:16px; border-radius:3px; background:var(--rose); }

.gate{
  max-width:420px; margin:0 auto; text-align:center; padding:44px 28px; border:1px solid var(--line); border-radius:4px;
}
.gate h3{ font-size:1.3rem; margin-bottom:8px; }
.gate p{ color:var(--ink-soft); font-size:0.92rem; margin-bottom:26px; }
.gate input{
  width:100%; padding:14px 16px; font-size:1rem; border:1px solid var(--line); border-radius:2px;
  text-align:center; background:transparent; color:var(--ink); font-family:var(--sans); outline:none;
  transition:border-color .2s;
}
.gate input:focus{ border-color:var(--rose); }
.gate .msg{ margin-top:14px; font-size:0.86rem; min-height:1.2em; color:var(--rose); }
.gate button{
  margin-top:20px; padding:12px 30px; border-radius:30px; border:none; background:var(--ink);
  color:#fff; font-family:var(--sans); font-weight:500; cursor:pointer; transition:transform .2s;
}
.gate button:active{ transform:scale(0.96); }

.letter{ display:none; max-width:560px; margin:70px auto 0; text-align:left; line-height:1.85; font-size:1.02rem; color:var(--ink); white-space:pre-line; }
.letter .drop{ font-family:var(--serif); font-size:2.6rem; float:left; line-height:0.8; margin:8px 8px 0 0; color:var(--rose); }
.letter .sign{ display:block; margin-top:26px; font-family:var(--serif); font-size:1.3rem; color:var(--rose); cursor:pointer; }

.coffee{ display:none; max-width:420px; margin:70px auto 0; text-align:center; padding:36px 24px; background:var(--sage-soft); border-radius:6px; }
.coffee h3{ color:#33512f; margin-bottom:8px; font-size:1.25rem; }
.coffee p{ color:#4a7c44; font-size:0.9rem; margin-bottom:24px; }
.coffee .row{ display:flex; flex-direction:column; gap:10px; }
.coffee button{ padding:13px; border-radius:30px; border:none; font-family:var(--sans); font-weight:600; cursor:pointer; font-size:0.98rem; transition:transform .2s; }
.coffee button:active{ transform:scale(0.96); }
.coffee .yes{ background:var(--sage); color:#fff; }
.coffee .no{ background:transparent; color:#4a7c44; border:1px solid #b9d1b3; }
.coffee .thanks{ display:none; color:#33512f; font-weight:600; }

footer{ text-align:center; padding:60px 24px 100px; color:var(--ink-faint); font-size:0.78rem; letter-spacing:0.06em; }

/* ============================================================
   AUDIO CONTROL
   ============================================================ */
#audio-btn{
  position:fixed; bottom:22px; right:22px; z-index:80; width:48px; height:48px; border-radius:50%;
  background:radial-gradient(circle, #241318 40%, #100a0c 100%); border:2px solid rgba(255,255,255,0.25);
  cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(0,0,0,0.25);
}
#audio-btn::after{ content:''; width:15px; height:15px; border-radius:50%; background:var(--blush); border:2px solid #100a0c; }
#audio-btn.spin{ animation:spin 4s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* particles */
.particle{ position:fixed; pointer-events:none; z-index:999; font-size:18px; will-change:transform; }
@keyframes floatAway{ to{ transform:translate(var(--tx),var(--ty)) scale(1.2); opacity:0; } }

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
}

@media (max-width:640px){
  .wrap{ padding:0 20px; }
  #memories .track{ gap:8vw; }
}
</style>
</head>

<script>
gsap.registerPlugin(ScrollTrigger);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

ScrollTrigger.config({ ignoreMobileResize: true });
if(!reduceMotion){ ScrollTrigger.normalizeScroll(true); }
document.fonts && document.fonts.ready.then(()=>ScrollTrigger.refresh());
window.addEventListener('load', ()=>ScrollTrigger.refresh());

function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function triggerVibration(p){ if(navigator.vibrate) navigator.vibrate(p); }
function createParticles(x,y,emoji="🌸",count=8){
  for(let i=0;i<count;i++){
    const p = el('div','particle',emoji);
    p.style.left=x+'px'; p.style.top=y+'px'; p.style.fontSize=(14+Math.random()*10)+'px';
    const angle=(Math.PI*2*i)/count, dist=50+Math.random()*60;
    p.style.setProperty('--tx',(Math.cos(angle)*dist)+'px');
    p.style.setProperty('--ty',(Math.sin(angle)*dist-25)+'px');
    p.style.animation='floatAway 1s cubic-bezier(.25,1,.5,1) forwards';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1000);
  }
}

const canvas=document.getElementById('confetti'), ctx=canvas.getContext('2d');
function fitCanvas(){ canvas.width=innerWidth; canvas.height=innerHeight; }
fitCanvas(); addEventListener('resize',fitCanvas);
let pieces=[], running=false;
const petalColors=['#ffb7c5','#ffffff','#ffdae0','#fde4e9'];
function spawnConfetti(count=50){
  for(let i=0;i<count;i++){
    pieces.push({x:Math.random()*canvas.width,y:-20-Math.random()*canvas.height*0.4,r:Math.random()*4+2,
      color:petalColors[Math.floor(Math.random()*petalColors.length)],vx:(Math.random()-0.5)*1.4,rot:Math.random()*360,life:400+Math.random()*150});
  }
  if(!running){ running=true; tick(); }
}
function tick(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=pieces.length-1;i>=0;i--){
    const p=pieces[i];
    ctx.fillStyle=p.color; ctx.globalAlpha=0.85;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    p.y+=1.2+p.r/4; p.x+=Math.sin(p.rot*Math.PI/180)*0.8; p.rot+=2; p.life--;
    if(p.y>canvas.height||p.life<=0) pieces.splice(i,1);
  }
  ctx.globalAlpha=1;
  pieces.length>0 ? requestAnimationFrame(tick) : (running=false);
}

const threadFill=document.querySelector('#thread .fill');
const bud=document.querySelector('#thread .bud');
ScrollTrigger.create({
  trigger:document.body, start:'top top', end:'bottom bottom', scrub:1,
  onUpdate: self=>{
    threadFill.style.height=(self.progress*100)+'%';
    bud.style.top=(self.progress*100)+'%';
    bud.textContent = self.progress>0.97 ? '🌸' : (self.progress>0.4 ? '🌷' : '🌱');
  }
});

(function heroBuild(){
  const title=document.getElementById('hero-title');
  CONFIG.hero.titleLines.forEach(line=>{
    const lineEl=el('span','line');
    const chars=line.split('').map(c=>`<span>${c===' '?'&nbsp;':c}</span>`).join('');
    lineEl.innerHTML=chars;
    title.appendChild(lineEl);
  });
  document.getElementById('hero-sub').textContent=CONFIG.hero.subtitle;

  const tl=gsap.timeline({delay:0.3});
  tl.from(title.querySelectorAll('.line span'), {yPercent:120, opacity:0, duration:1, ease:'power4.out', stagger:0.02})
    .to('#hero-sub',{opacity:1,duration:0.8},'-=0.3')
    .to('#scroll-cue',{opacity:1,duration:0.8},'-=0.4');

  gsap.to('#hero-title,#hero-sub',{ yPercent:-18, opacity:0, ease:'none',
    scrollTrigger:{ trigger:'#hero', start:'top top', end:'bottom top', scrub:1 } });
})();

(function whisperBuild(){
  const stage=document.getElementById('whisper-stage');
  const lines = CONFIG.whisper.map(text=>{
    const l=el('div','line',text); stage.appendChild(l); return l;
  });
  const n=lines.length;
  const tl=gsap.timeline({
    scrollTrigger:{ trigger:'#whisper', start:'top top', end:'bottom bottom', scrub:1, pin:'.stage' }
  });
  lines.forEach((l,i)=>{
    tl.fromTo(l,{opacity:0,y:26,scale:0.96},{opacity:1,y:0,scale:1,duration:0.35})
      .to(l,{opacity:0,y:-26,duration:0.35}, i<n-1 ? '+=0.5' : '+=0.9');
  });
})();

(function memoriesBuild(){
  const frame=document.getElementById('memories-frame');
  const item = (CONFIG.memories && CONFIG.memories[0]) || {type:'placeholder'};
  let mediaEl=null;

  if(item.type==='video'){
    mediaEl=document.createElement('video');
    mediaEl.src=item.src; mediaEl.muted=true; mediaEl.loop=true; mediaEl.playsInline=true; mediaEl.autoplay=true;
    frame.appendChild(mediaEl);
    mediaEl.addEventListener('loadedmetadata', ()=>ScrollTrigger.refresh());
    mediaEl.play().catch(()=>{});
  } else if(item.type==='image'){
    mediaEl=document.createElement('img'); mediaEl.src=item.src;
    mediaEl.addEventListener('load', ()=>ScrollTrigger.refresh());
    frame.appendChild(mediaEl);
  } else {
    frame.classList.add('placeholder'); frame.textContent='🌷';
  }
  if(item.caption){ frame.appendChild(el('div','cap',item.caption)); }

  const tl=gsap.timeline({
    scrollTrigger:{ trigger:'#memories', start:'top top', end:'bottom bottom',
      scrub:1, pin:'.stage', pinSpacing:true, invalidateOnRefresh:true }
  });
  gsap.set(frame, {scale:0.82, opacity:0});
  tl.to(frame, {scale:1, opacity:1, ease:'none', duration:1})
    .to(frame, {scale:0.9, opacity:0, ease:'none', duration:1});
})();

(function buildupBuild(){
  const p=document.getElementById('buildup-text');
  const words=CONFIG.buildupLine.split(' ');
  p.innerHTML = words.map(w=>`<span class="mask"><span>${w}&nbsp;</span></span>`).join('');
  gsap.to(p.querySelectorAll('.mask span'), { opacity:1, stagger:0.04, ease:'none',
    scrollTrigger:{ trigger:'#buildup', start:'top 70%', end:'bottom 60%', scrub:1 } });
})();

let opened=false;
gsap.to('#flower-hint',{ opacity:0.75, duration:0.6,
  scrollTrigger:{ trigger:'#celebration', start:'top 60%', onEnter:()=>document.getElementById('flower-hint').classList.add('show') } });

document.getElementById('flower-btn').addEventListener('click', (e)=>{
  if(opened) return; opened=true;
  triggerVibration(20);
  const r=e.target.getBoundingClientRect();
  createParticles(r.left+r.width/2, r.top+r.height/2, '🌸', 10);
  gsap.to('#flower-btn',{scale:0.4,opacity:0,duration:0.5,ease:'power2.in'});
  gsap.to('#flower-hint',{opacity:0,duration:0.3});

  setTimeout(()=>{
    const suspense=document.getElementById('suspense');
    suspense.style.pointerEvents='auto'; suspense.style.opacity=1;
    if(musicPlaying) fadeOutMusic(1400);

    setTimeout(()=>{
      document.getElementById('flash').style.opacity=0.9;
      if(CONFIG.music.climax){
        bgMusic.src=CONFIG.music.climax; bgMusic.volume=1; bgMusic.play().catch(()=>{});
        audioBtn.classList.add('spin'); musicPlaying=true;
      }
      spawnConfetti(120);
      createParticles(innerWidth/2, innerHeight/2, '🌸', 16);

      setTimeout(()=>{
        suspense.style.opacity=0; suspense.style.pointerEvents='none';
        document.getElementById('flash').style.opacity=0;
      },500);
    },1600);
  },500);
});

(function carouselBuild(){
  const car=document.getElementById('carousel'), dots=document.getElementById('carousel-dots');
  const imgs = (CONFIG.finalCarousel && CONFIG.finalCarousel.length) ? CONFIG.finalCarousel : [null];
  imgs.forEach((src,i)=>{
    const slide=el('div','slide');
    slide.innerHTML = src ? `<img src="${src}" alt="">` : `<div class="placeholder">🌻</div>`;
    car.appendChild(slide);
    const d=el('div','dot'+(i===0?' active':'')); dots.appendChild(d);
  });
  car.addEventListener('scroll',()=>{
    const idx=Math.round(car.scrollLeft/car.clientWidth);
    [...dots.children].forEach((d,i)=>d.classList.toggle('active',i===idx));
  });
})();

document.getElementById('gate-hint').textContent = CONFIG.password.hint;
document.getElementById('gate-btn').addEventListener('click', checkPassword);
document.getElementById('gate-input').addEventListener('keypress', e=>{ if(e.key==='Enter') checkPassword(); });

function checkPassword(){
  const input=document.getElementById('gate-input'), msg=document.getElementById('gate-msg');
  const guess=input.value.trim().toLowerCase();
  if(guess===''){ msg.textContent='Are kuch likh toh do pehle! 😂'; triggerVibration(30); return; }
  if(guess===CONFIG.password.answer){
    msg.style.color='#33512f'; msg.textContent='Are waah, tumhe pata tha! ✨';
    triggerVibration([40,60,100]);
    const r=input.getBoundingClientRect(); createParticles(r.left+r.width/2,r.top,'✨',10); createParticles(r.left+r.width/2,r.top,'💖',8);
    setTimeout(()=>{
      document.getElementById('gate').style.display='none';
      revealLetter();
    },1000);
  } else {
    msg.style.color='var(--rose)'; msg.textContent='Nope! Try again 😉';
    triggerVibration([50,50]);
    gsap.fromTo(input,{x:-8},{x:0,duration:0.35,ease:'elastic.out(1,0.4)'});
  }
}

function revealLetter(){
  const letter=document.getElementById('letter');
  const text=CONFIG.letter.trim();
  document.querySelector('.letter .drop').textContent=text[0];
  document.getElementById('letter-text').textContent=text.slice(1);
  const sign=document.getElementById('letter-sign');
  sign.textContent=`Tumhara, ${CONFIG.yourName}`;
  sign.addEventListener('click',(e)=>{ createParticles(e.clientX,e.clientY,'🌻',10); createParticles(e.clientX,e.clientY,'💛',6); });
  letter.style.display='block';
  gsap.fromTo(letter,{opacity:0,y:20},{opacity:1,y:0,duration:0.8});
  spawnConfetti(30);

  setTimeout(()=>{
    const coffee=document.getElementById('coffee');
    document.getElementById('coffee-q').textContent=CONFIG.coffee.question;
    document.getElementById('coffee-sub').textContent=CONFIG.coffee.sub;
    const btns=document.getElementById('coffee-buttons');
    const yesBtn=el('button','yes',CONFIG.coffee.yes);
    const noBtn=el('button','no',CONFIG.coffee.no);
    yesBtn.onclick=()=>sendCoffeeResponse(CONFIG.coffee.yes);
    noBtn.onclick=()=>sendCoffeeResponse(CONFIG.coffee.no);
    btns.append(yesBtn,noBtn);
    coffee.style.display='block';
    gsap.fromTo(coffee,{opacity:0,y:20},{opacity:1,y:0,duration:0.8});
  }, 600);
}

function sendCoffeeResponse(answer){
  triggerVibration([30,40]);
  document.getElementById('coffee-buttons').style.display='none';
  document.getElementById('coffee-thanks').style.display='block';
  if(CONFIG.discordWebhook){
    fetch(CONFIG.discordWebhook,{ method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({content:`🚨 **Birthday update!** ${CONFIG.herName} reached the end and clicked:\n> **"${answer}"**`}) })
      .catch(()=>{});
  }
}

const bgMusic=new Audio(); bgMusic.loop=false; bgMusic.preload='auto';
const audioBtn=document.getElementById('audio-btn');
let musicPlaying=false, trackIndex=0;
if(CONFIG.music.enabled && CONFIG.music.playlist.length){ bgMusic.src=CONFIG.music.playlist[0]; }
bgMusic.addEventListener('ended', ()=>{
  if(!CONFIG.music.playlist.length) return;
  trackIndex=(trackIndex+1)%CONFIG.music.playlist.length;
  bgMusic.src=CONFIG.music.playlist[trackIndex];
  bgMusic.play().catch(()=>{});
});
audioBtn.addEventListener('click', ()=>{
  if(musicPlaying){ bgMusic.pause(); audioBtn.classList.remove('spin'); }
  else { bgMusic.volume=1; bgMusic.play().catch(()=>{}); audioBtn.classList.add('spin'); }
  musicPlaying=!musicPlaying;
});
function fadeOutMusic(duration){
  const steps=20; let vol=bgMusic.volume; const step=vol/steps;
  const iv=setInterval(()=>{ vol-=step; if(vol<=0){ vol=0; clearInterval(iv);} bgMusic.volume=vol; }, duration/steps);
}

const originalTitle=document.title;
addEventListener('blur',()=>document.title='Come back! 🥺🌻');
addEventListener('focus',()=>document.title=originalTitle);

ScrollTrigger.refresh();
</script>
</body>
</html>
